name: CI (Terraform Validate)

# Roda em toda PR contra main — não tem credenciais AWS (essas só existem no
# workflow_dispatch de deploy, via input manual), então valida só a sintaxe e
# a formatação do Terraform, sem terraform plan (que exigiria backend/state
# reais). É o gate que a branch protection do main exige antes do merge.
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/ci.yml"

jobs:
  validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform Init (sem backend remoto)
        run: terraform -chdir=infra init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=infra validate
