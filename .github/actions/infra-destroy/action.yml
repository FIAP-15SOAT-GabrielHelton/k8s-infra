name: 'Infra Destroy'
description: 'Remove o cluster EKS, node group e VPC via Terraform'

inputs:
  aws_access_key_id:
    description: 'AWS Access Key ID'
    required: true
  aws_secret_access_key:
    description: 'AWS Secret Access Key'
    required: true
  aws_session_token:
    description: 'AWS Session Token'
    required: true
  new_relic_license_key:
    description: 'New Relic Ingest License Key'
    required: true
  new_relic_account_id:
    description: 'New Relic Account ID'
    required: true
  new_relic_api_key:
    description: 'New Relic User API Key'
    required: true
  new_relic_region:
    description: 'New Relic account region (US ou EU)'
    required: true
  new_relic_alert_email:
    description: 'E-mail que recebe notificações de alerta'
    required: true

runs:
  using: composite
  steps:
    - name: Mask Sensitive Credentials
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.aws_access_key_id }}"
        echo "::add-mask::${{ inputs.aws_secret_access_key }}"
        echo "::add-mask::${{ inputs.aws_session_token }}"
        echo "::add-mask::${{ inputs.new_relic_license_key }}"
        echo "::add-mask::${{ inputs.new_relic_api_key }}"

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-session-token: ${{ inputs.aws_session_token }}
        aws-region: us-east-1

    - name: Bootstrap S3 Backend
      shell: bash
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        TF_BUCKET="oficina-mecanica-tfstate-${ACCOUNT_ID}"
        echo "TF_BUCKET=$TF_BUCKET" >> "$GITHUB_ENV"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.5.7
        terraform_wrapper: false

    # Node group e cluster precisam ser destruídos antes da VPC. Os outros repos
    # (db-infra, api) devem ser destruídos antes deste, já que dependem dos
    # parâmetros SSM publicados aqui.
    - name: Destroy Infrastructure
      shell: bash
      env:
        TF_VAR_new_relic_license_key: ${{ inputs.new_relic_license_key }}
        TF_VAR_new_relic_account_id: ${{ inputs.new_relic_account_id }}
        TF_VAR_new_relic_api_key: ${{ inputs.new_relic_api_key }}
        TF_VAR_new_relic_region: ${{ inputs.new_relic_region }}
        TF_VAR_new_relic_alert_email: ${{ inputs.new_relic_alert_email }}
      run: |
        cd infra/
        terraform init \
          -backend-config="bucket=$TF_BUCKET" \
          -backend-config="key=oficina-mecanica/k8s-infra.tfstate" \
          -backend-config="region=us-east-1"

        terraform destroy -auto-approve
